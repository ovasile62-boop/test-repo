name: Check README
 
on: [push, pull_request]
 
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - name: Detect gibberish
        run: |
          if grep -Ein '\b(asdf|qwerty|asdfgh|lorem ipsum)\b' README.md; then
            echo "Gibberish detected in README.md!"
            exit 1
